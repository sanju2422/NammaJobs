[data-theme=dark]{--bg:#111;--card:#1C1C1C;--border:#2E2E2E;--tx:#EFEFEF;--tx2:#AAAAAA;--tx3:#666;--nv:#080D1A;--sfl:#1E1008;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--fkn);background:var(--bg);color:var(--tx);line-height:1.7;}
a{text-decoration:none;color:inherit;}

/* TOPBAR */
.topbar{background:var(--nv);padding:7px 0;}
.tbi{max-width:1100px;margin:0 auto;padding:0 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.tlogo{display:flex;align-items:center;gap:8px;color:#fff;font-family:var(--fen);font-weight:700;font-size:15px;cursor:pointer;}
.tlogo img{width:32px;height:32px;border-radius:6px;object-fit:cover;}
.tlogo span{color:var(--sf);}
.tbright{display:flex;gap:8px;align-items:center;}
.tbtn{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-family:var(--fen);transition:.2s;}
.tbtn:hover{color:#fff;border-color:rgba(255,255,255,.5);}
.tbtn.sf{background:var(--sf);border-color:var(--sf);color:#fff;}
.ir-btn{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--sf);background:transparent;color:var(--sf);cursor:pointer;font-family:var(--fen);transition:.2s;text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.ir-btn:hover{background:var(--sf);color:#fff;}
.ir-tip{display:none;position:absolute;top:calc(100% + 10px);right:0;width:240px;background:#0D1B3E;color:#fff;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.6;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.3);pointer-events:none;}
.ir-tip::before{content:'';position:absolute;top:-6px;right:16px;width:10px;height:10px;background:#0D1B3E;transform:rotate(45deg);}
.ir-wrap:hover .ir-tip{display:block;}
.ir-tip-en{font-size:13px;font-weight:700;color:#fff;margin-bottom:5px;}
.ir-tip-kn{font-size:12px;color:rgba(255,255,255,.75);font-family:var(--fkn);}
[data-theme=dark] .ir-btn{border-color:#00C9B1;color:#00C9B1;}
[data-theme=dark] .ir-btn:hover{background:#00C9B1;color:#050E1A;}
[data-theme=dark] .ir-tip{background:#050E1A;border:1px solid #1A3A5C;}
[data-theme=dark] .ir-tip::before{background:#050E1A;}
.breadcrumb{background:var(--card);border-bottom:1px solid var(--border);padding:10px 0;font-size:12px;color:var(--tx3);font-family:var(--fen);}
.bci{max-width:1100px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bca{color:var(--sf);cursor:pointer;}
.bca:hover{text-decoration:underline;}

/* LAYOUT */
.wrap{max-width:1100px;margin:0 auto;padding:20px 18px;display:grid;grid-template-columns:1fr 320px;gap:22px;}
@media(max-width:860px){.wrap{grid-template-columns:1fr;}}

/* MAIN ARTICLE */
.article{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.art-hero{background:linear-gradient(135deg,var(--nv),#1A2F5E);padding:28px 28px 24px;position:relative;overflow:hidden;}
.art-hero::before{content:'';position:absolute;inset:0;opacity:.06;background-image:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%);background-size:14px 14px;}
.art-cat{display:inline-flex;align-items:center;gap:5px;background:var(--sf);color:#fff;font-size:11px;font-weight:800;padding:3px 12px;border-radius:20px;margin-bottom:12px;font-family:var(--fen);position:relative;z-index:1;}
.art-title{font-size:22px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:8px;position:relative;z-index:1;}
.art-title-kn{font-size:18px;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:14px;position:relative;z-index:1;}
.art-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.6);font-family:var(--fen);position:relative;z-index:1;}
.art-meta span{display:flex;align-items:center;gap:4px;}

/* INFO TABLE */
.info-table{width:100%;border-collapse:collapse;font-size:14px;}
.info-table tr:nth-child(even) td{background:var(--bg);}
.info-table td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:top;}
.info-table td:first-child{font-weight:700;color:var(--tx);width:40%;font-family:var(--fen);white-space:nowrap;}
.info-table td:last-child{color:var(--tx2);}

/* SECTION */
.sec{padding:20px 24px;border-bottom:1px solid var(--border);}
.sec:last-child{border-bottom:none;}
.sec-ttl{font-size:16px;font-weight:700;color:var(--nv);margin-bottom:12px;display:flex;align-items:center;gap:8px;font-family:var(--fen);}
[data-theme=dark] .sec-ttl{color:#E8E8E8;}
.sec-ttl::before{content:'';width:4px;height:20px;background:var(--sf);border-radius:2px;flex-shrink:0;}
.sec-body{font-size:14px;color:var(--tx2);line-height:1.8;}
.sec-body p{margin-bottom:10px;}
.sec-body ul{padding-left:18px;margin-bottom:10px;}
.sec-body li{margin-bottom:5px;}

/* CAT TABLE */
.cat-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.cat-tbl th{background:var(--nv);color:#fff;padding:9px 14px;text-align:left;font-family:var(--fen);font-size:12px;}
.cat-tbl td{padding:9px 14px;border-bottom:1px solid var(--border);}
.cat-tbl tr:nth-child(even) td{background:var(--bg);}
.cat-tbl tr:last-child td{border-bottom:none;font-weight:700;}

/* HOW TO APPLY */
.apply-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:8px;padding:12px 14px;border:1px solid var(--border);}
.step-num{width:28px;height:28px;background:var(--sf);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;font-family:var(--fen);}
.step-txt{font-size:13px;color:var(--tx2);line-height:1.5;}
.step-txt strong{color:var(--tx);display:block;margin-bottom:2px;}

/* APPLY BUTTONS */
.apply-box{background:linear-gradient(135deg,#0A3020,#1A5C3A);border-radius:10px;padding:20px;text-align:center;margin-top:8px;}
.apply-box-ttl{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px;}
.apply-box-sub{font-size:12px;color:rgba(255,255,255,.65);margin-bottom:16px;font-family:var(--fen);}
.apply-box-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-apply-main{background:var(--sf);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:800;cursor:pointer;font-family:var(--fen);transition:.15s;display:flex;align-items:center;gap:6px;}
.btn-apply-main:hover{background:var(--sfd);}
.btn-notif{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--fen);transition:.15s;}
.btn-notif:hover{background:rgba(255,255,255,.2);}

/* SHARE */
.share-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.share-btn{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:var(--fen);display:flex;align-items:center;gap:5px;transition:.15s;}
.sh-wa{background:#25D366;color:#fff;}.sh-wa:hover{background:#1DAD55;}
.sh-tg{background:#0088cc;color:#fff;}.sh-tg:hover{background:#006699;}
.sh-cp{background:var(--border);color:var(--tx);}.sh-cp:hover{background:var(--tx3);color:#fff;}

/* IMPORTANT DATES */
.dates-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
@media(max-width:500px){.dates-grid{grid-template-columns:1fr;}}
.date-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 13px;}
.date-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);font-family:var(--fen);margin-bottom:3px;}
.date-val{font-size:14px;font-weight:700;color:var(--nv);font-family:var(--fen);}
[data-theme=dark] .date-val{color:#E8E8E8;}
.date-item.highlight{border-color:var(--sf);background:var(--sfl);}
.date-item.highlight .date-val{color:var(--sfd);}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:14px;}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.sch{background:var(--nv);padding:10px 14px;font-size:13px;font-weight:700;color:#fff;font-family:var(--fen);}
.scb{padding:12px 14px;}
.quick-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.quick-item:last-child{border-bottom:none;padding-bottom:0;}
.qi-label{color:var(--tx3);font-family:var(--fen);font-size:11px;font-weight:700;text-transform:uppercase;}
.qi-val{font-weight:700;color:var(--tx);text-align:right;font-family:var(--fen);}
.qi-val.open{color:var(--gn);}
.qi-val.closed{color:#A02010;}
.qi-val.soon{color:#8A6000;}
.rel-job{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.rel-job:last-child{border-bottom:none;padding-bottom:0;}
.rel-job:hover .rjt{color:var(--sf);}
.rji{font-size:20px;flex-shrink:0;}
.rjt{font-size:12px;font-weight:600;color:var(--tx);line-height:1.3;transition:.15s;}
.rjm{font-size:10px;color:var(--tx3);font-family:var(--fen);margin-top:2px;}

/* PILLS */
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;font-family:var(--fen);margin:2px;}
.p-open{background:var(--gnl);color:var(--gnd);}
.p-closed{background:#FEE8E8;color:#A02010;}
.p-soon{background:#FDF3D7;color:#8A6000;}
.p-blue{background:#E6F1FB;color:#185FA5;}
.p-purple{background:#F0EEFF;color:#5234B5;}

/* LOADING */
.loading-page{text-align:center;padding:80px 20px;color:var(--tx3);}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--sf);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
footer{background:var(--nv);color:rgba(255,255,255,.6);padding:20px 18px;margin-top:28px;text-align:center;font-size:12px;font-family:var(--fen);}
footer a{color:var(--sf);}
</style>
</head>

// Dark mode
function toggleDark(){
  const on = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', on?'light':'dark');
  document.getElementById('dmb2').textContent = on?'🌙':'☀️';

(function(){if(localStorage.getItem('nj_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('dmb2').textContent='☀️';}})();

function scrollToApply(){document.getElementById('apply-section')?.scrollIntoView({behavior:'smooth'});}

function daysLeft(ld){
  if(!ld)return null;
  const t=new Date();t.setHours(0,0,0,0);
  const d=new Date(ld);d.setHours(0,0,0,0);
  return Math.ceil((d-t)/86400000);
}

function statusBadge(s){
  if(s==='open')return`<span class="pill p-open">● Open</span>`;
  if(s==='closed')return`<span class="pill p-closed">● Closed</span>`;
  return`<span class="pill p-soon">◐ Coming Soon</span>`;
}

          ${catsSource.split(',').map(c=>{
            const parts=c.trim().split('-');
            return`<tr><td>${parts[0]||''}</td><td><strong>${parts[1]||''}</strong></td></tr>`;
          }).join('')}
          <tr><td><strong>Total / ಒಟ್ಟು</strong></td><td><strong>${j.seats||0}</strong></td></tr>
        </tbody>
      </table>
    </div>` : '';

  const logo = getDeptLogo(j.dept);
  const logoHtml = logo ? `<img src="${logo}" alt="${j.dept}" style="width:70px;height:70px;object-fit:contain;background:#fff;border-radius:12px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.3);margin-bottom:14px;display:block;" onerror="this.style.display='none'">` : '';

  const html = `
  <div class="article">
    <div class="art-hero">
      ${logoHtml}
      <div class="art-cat">${catIcons[j.cat]||'💼'} ${catNames[j.cat]||'Government Job'}</div>
      <div class="art-title">${j.title_en||''}</div>
      ${j.title_kn?`<div class="art-title-kn">${j.title_kn}</div>`:''}
      <div class="art-meta">
        <span>🏢 ${j.dept||''}</span>
        <span>📍 ${j.loc||'Karnataka'}</span>
        <span>👥 ${j.seats||0} Posts</span>
        ${j.notif?`<span>📋 ${j.notif}</span>`:''}
      </div>
    </div>

    <!-- QUICK INFO TABLE -->
    <div class="sec">
      <div class="sec-ttl">Job Overview</div>
      <table class="info-table">
        <tr><td>Organization</td><td>${j.dept||'—'}</td></tr>
        <tr><td>Post Name</td><td>${j.title_en||'—'}</td></tr>
        <tr><td>Total Vacancies</td><td><strong>${j.seats||0}</strong></td></tr>
        <tr><td>Pay Scale / Salary</td><td>${j.salary||'—'}</td></tr>
        <tr><td>Age Limit</td><td>${j.age||'—'}</td></tr>
        <tr><td>Qualification</td><td>${j.skills||'—'}</td></tr>
        <tr><td>Location</td><td>${j.loc||'Karnataka'}</td></tr>
        ${j.fee?`<tr><td>Application Fee</td><td><strong style="color:var(--sf)">${j.fee}</strong></td></tr>`:''}
        ${j.start_date?`<tr><td>Apply From</td><td><strong style="color:var(--gn)">📅 ${j.start_date}</strong></td></tr>`:''}
        <tr><td>Last Date</td><td><strong style="color:${isExpiring?'#C49010':'var(--tx)'}">${j.last_date||'—'}</strong></td></tr>
        <tr><td>Notification No.</td><td>${j.notif||'—'}</td></tr>
        <tr><td>Official Website</td><td>${j.official_url?`<a href="${j.official_url}" target="_blank" style="color:var(--sf);">${j.official_url} ↗</a>`:'—'}</td></tr>
      </table>
    </div>

    <!-- IMPORTANT DATES -->
    ${j.last_date?`
    <div class="sec">
      <div class="sec-ttl">Important Dates</div>
      <div class="dates-grid">
        ${j.start_date?`<div class="date-item" style="border-color:var(--gn);background:var(--gnl);"><div class="date-label">Application Start</div><div class="date-val" style="color:var(--gn)">📅 ${j.start_date}</div></div>`:'<div class="date-item"><div class="date-label">Application Start</div><div class="date-val">Available Now</div></div>'}
        <div class="date-item highlight"><div class="date-label">Last Date to Apply</div><div class="date-val">📅 ${j.last_date}</div></div>
        ${dl!==null?`<div class="date-item ${isExpiring?'highlight':''}"><div class="date-label">Days Remaining</div><div class="date-val">${dl>=0?dl+' Days Left':'Expired'}</div></div>`:''}
      </div>
    </div>`:''}

    <!-- DESCRIPTION -->
    ${j.description?`
    <div class="sec">
      <div class="sec-ttl">About this Job</div>
      <div class="sec-body"><p>${j.description}</p></div>
    </div>`:''}

    <!-- CATEGORY VACANCIES -->
    ${j.cats?`
    <div class="sec">
      <div class="sec-ttl">Category-wise Vacancies</div>
      <table class="cat-tbl">
        <thead><tr><th>Category</th><th>Vacancies</th></tr></thead>
        <tbody>
          ${j.cats.split(',').map(c=>{
            const parts=c.trim().split('-');
            return`<tr><td>${parts[0]||''}</td><td><strong>${parts[1]||''}</strong></td></tr>`;
          }).join('')}
          <tr><td><strong>Total</strong></td><td><strong>${j.seats||0}</strong></td></tr>
        </tbody>
      </table>
    </div>`:''}

    <!-- SYLLABUS -->
    ${j.syllabus?`
    <div class="sec">
      <div class="sec-ttl">Exam Syllabus</div>
      <div class="sec-body"><p>${j.syllabus}</p></div>
      ${j.syllabus_url?`<div style="margin-top:10px;"><a href="${j.syllabus_url}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:var(--nv);color:#fff;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;text-decoration:none;font-family:var(--fen);">📄 Download Official Syllabus PDF ↗</a></div>`:''}
    </div>`:''}

    <!-- HOW TO APPLY -->
    <div class="sec" id="apply-section">
      <div class="sec-ttl">How to Apply</div>
      <div class="apply-steps">
        ${(j.how_to_apply||'').split('\n').filter(s=>s.trim()).map((s,i)=>`
        <div class="step">
          <div class="step-num">${i+1}</div>
          <div class="step-txt">${s}</div>
        </div>`).join('')||htaSteps.map((s,i)=>`
        <div class="step">
          <div class="step-num">${i+1}</div>
          <div class="step-txt">${s}</div>
        </div>`).join('')}
      </div>
    </div>

    <!-- APPLY NOW BOX -->
    ${isOpen?`
    <div class="sec">
      <div class="apply-box">
        <div class="apply-box-ttl">Ready to Apply?</div>
        <div class="apply-box-sub">Click below to go to the official application portal</div>
        <div class="apply-box-btns">
          ${j.official_url?`<button class="btn-apply-main" onclick="window.open('${j.official_url}','_blank')">🌐 Apply Online ↗</button>`:''}
          <button class="btn-notif" onclick="shareJob()">🔗 Share this Job</button>
        </div>
      </div>
    </div>`:''}

    <!-- SHARE -->
    <div class="sec">
      <div class="sec-ttl">Share this Job</div>
      <div class="share-row">
        <button class="share-btn sh-wa" onclick="shareWA()">📱 WhatsApp</button>
        <button class="share-btn sh-tg" onclick="shareTG()">✈️ Telegram</button>
        <button class="share-btn sh-cp" id="copy-btn" onclick="copyLink()">🔗 Copy Link</button>
      </div>
    </div>
  </div>`;

  document.getElementById('main-content').innerHTML = html;
}

function renderSidebar(j, jobs){
  const related = jobs.filter(x=>x.id!==j.id && (x.cat===j.cat||x.status==='open')).slice(0,5);
  document.getElementById('sidebar-content').innerHTML = `
    <div class="scard">
      <div class="sch">📋 Quick Details</div>
      <div class="scb">
        <div class="quick-item"><span class="qi-label">Status</span><span class="qi-val ${j.status}">${j.status.charAt(0).toUpperCase()+j.status.slice(1)}</span></div>
        <div class="quick-item"><span class="qi-label">Posts</span><span class="qi-val">${j.seats||0}</span></div>
        <div class="quick-item"><span class="qi-label">Salary</span><span class="qi-val" style="font-size:11px;">${j.salary||'—'}</span></div>
        <div class="quick-item"><span class="qi-label">Age Limit</span><span class="qi-val">${j.age||'—'}</span></div>
        <div class="quick-item"><span class="qi-label">Last Date</span><span class="qi-val" style="color:var(--sf)">${j.last_date||'—'}</span></div>
        ${j.official_url?`<div style="margin-top:12px;"><button onclick="window.open('${j.official_url}','_blank')" style="width:100%;background:var(--sf);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--fen)">Apply Now ↗</button></div>`:''}
      </div>
    </div>

    <div class="scard">
      <div class="sch">🖼️ Image Resizer Tool</div>
      <div class="scb" style="text-align:center;padding:16px 14px;">
        <div style="font-size:32px;margin-bottom:8px;">📐</div>
        <div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:5px;font-family:var(--fen);">📐 Free Image Tools</div>
        <div style="font-size:12px;color:var(--tx2);margin-bottom:5px;line-height:1.5;">Job Application Ready!</div>
        <div style="font-size:12px;color:var(--tx2);margin-bottom:14px;line-height:1.5;font-family:var(--fkn);">ನಿಮ್ಮ ಫೋಟೋ ಮತ್ತು ದಾಖಲೆಗಳನ್ನು ಅರ್ಜಿಗೆ ತಕ್ಕಂತೆ Resize ಮಾಡಿ</div>
        <a href="tools.html" target="_blank" style="display:block;background:var(--sf);color:#fff;border-radius:8px;padding:10px;font-size:13px;font-weight:700;text-decoration:none;font-family:var(--fen);transition:.15s;">🖼️ Open Image Resizer ↗</a>
        <div style="font-size:11px;color:var(--tx3);margin-top:8px;font-family:var(--fen);">✓ Resize · ✓ Compress · ✓ Convert · ✓ PDF</div>
      </div>
    </div>
    ${related.length?`
    <div class="scard">
      <div class="sch">🔥 Related Jobs</div>
      <div class="scb">
        ${related.map(r=>`
        <div class="rel-job" onclick="window.location.href='job.html?job=${r.id}'">
          <div class="rji">${r.icon||'💼'}</div>
          <div><div class="rjt">${r.title_en}</div><div class="rjm">${r.dept} · ${r.seats||0} Posts</div></div>
        </div>`).join('')}
      </div>
    </div>`:''}
    <div class="scard">
      <div class="sch">📢 Share & Help Others</div>
      <div class="scb" style="display:flex;flex-direction:column;gap:8px;">
        <button class="share-btn sh-wa" style="justify-content:center;" onclick="shareWA()">📱 Share on WhatsApp</button>
        <button class="share-btn sh-tg" style="justify-content:center;" onclick="shareTG()">✈️ Share on Telegram</button>
      </div>
    </div>`;
}

// SHARE FUNCTIONS
function getShareUrl(){return window.location.origin+'/job.html?job='+job.id;}
function getShareText(){return `🔔 ${job.title_en}\n🏢 ${job.dept}\n👥 ${job.seats||0} Posts\n📅 Last Date: ${job.last_date||'Check site'}\n\n🔗 `+getShareUrl();}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent(getShareText()),'_blank');}
function shareTG(){window.open('https://t.me/share/url?url='+encodeURIComponent(getShareUrl())+'&text='+encodeURIComponent(job.title_en),'_blank');}
function copyLink(){
  navigator.clipboard.writeText(getShareUrl()).then(()=>{
    const b=document.getElementById('copy-btn');
    if(b){b.textContent='✓ Copied!';setTimeout(()=>b.textContent='🔗 Copy Link',2000);}
  });
}
function shareJob(){shareWA();}

// LOAD
async function load(){
  const t=localStorage.getItem('nj_theme');
  if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('dmb2').textContent='☀️';}

  const params=new URLSearchParams(window.location.search);
  const id=params.get('job');
  if(!id){window.location.href='index.html';return;}

  try{
    const r=await fetch(`${SB_URL}/rest/v1/jobs?order=created_at.desc`,{headers:H});
    allJobs=await r.json();
    job=allJobs.find(x=>x.id===id);
    if(!job){document.getElementById('main-content').innerHTML='<div class="loading-page">⚠️ Job not found. <a href="index.html" style="color:var(--sf)">Go back</a></div>';return;}
    renderJob(job);
    renderSidebar(job,allJobs);
  }catch(e){
    document.getElementById('main-content').innerHTML='<div class="loading-page">⚠️ Could not load. Please check connection.</div>';
  }
}
load();
</script>
