<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resizer – Namma Jobs</title>
<link rel="icon" type="image/png" href="NammaJobs.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Kannada:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --grad-bg:radial-gradient(ellipse at top,#1e3a8a 0%,#0c1f4a 40%,#061333 100%);
  --grad-pink:linear-gradient(135deg,#7c3aed,#a855f7);
  --glass-bg:rgba(255,255,255,0.06);
  --glass-bg-dark:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.12);
  --glass-border-strong:rgba(255,255,255,0.25);
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --fen:'DM Sans',sans-serif;
  --fkn:'Noto Sans Kannada',sans-serif;
  --fhead:'Plus Jakarta Sans',sans-serif;
}
body{font-family:var(--fen);min-height:100vh;background:var(--grad-bg);background-attachment:fixed;color:#fff;}

.hdr{background:rgba(0,0,0,0.3);backdrop-filter:blur(20px);border-bottom:2px solid var(--glass-border);padding:14px 0;position:sticky;top:0;z-index:100;}
.hwrap{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;justify-content:space-between;}
.hbrand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.hlogo{width:42px;height:42px;border-radius:11px;background:#fff;padding:3px;display:flex;align-items:center;justify-content:center;}
.hlogo img{width:100%;height:100%;object-fit:contain;}
.htxt-en{font-family:var(--fhead);font-weight:800;font-size:17px;color:#FFD60A;}
.htxt-en span{color:#FF3B30;}
.htxt-kn{font-family:var(--fkn);font-size:12px;color:#FFD60A;font-weight:700;margin-top:2px;}
.htxt-kn span{color:#FF3B30;}
.btn-back{background:var(--glass-bg);border:2px solid var(--glass-border);color:#fff;padding:9px 14px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;}
.btn-back:hover{background:var(--glass-bg-dark);}

.container{max-width:1100px;margin:0 auto;padding:30px 16px 50px;}

.hero{text-align:center;margin-bottom:28px;}
.hero h1{font-family:var(--fhead);font-size:32px;font-weight:800;color:#fff;margin-bottom:6px;text-shadow:0 4px 20px rgba(0,0,0,0.25);}
.hero-kn{font-family:var(--fkn);font-size:18px;font-weight:700;color:#c4b5fd;margin-bottom:8px;}
.hero p{color:rgba(255,255,255,0.85);font-size:14px;font-weight:600;}

.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:24px;}
.tool-tab{
  background:var(--glass-bg);
  backdrop-filter:blur(15px);
  border:2px solid var(--glass-border);
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  transition:all .25s;
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
}
.tool-tab:hover{background:var(--glass-bg-dark);transform:translateY(-2px);}
.tool-tab.on{background:var(--grad-pink);border-color:rgba(168,85,247,0.7);box-shadow:0 6px 20px rgba(168,85,247,0.4);}
.tool-icon{font-size:28px;}
.tool-name{font-weight:800;font-size:14px;}
.tool-desc{font-size:11px;color:rgba(255,255,255,0.7);font-weight:600;margin-top:2px;}
.tool-tab.on .tool-desc{color:rgba(255,255,255,0.95);}

.panel{
  background:var(--glass-bg);
  backdrop-filter:blur(20px);
  border:2px solid var(--glass-border);
  border-radius:18px;
  padding:24px;
  box-shadow:var(--shadow);
}

.upload-zone{
  background:var(--glass-bg-dark);
  border:2px dashed var(--glass-border-strong);
  border-radius:14px;
  padding:40px 20px;
  text-align:center;
  cursor:pointer;
  transition:all .25s;
}
.upload-zone:hover{background:rgba(168,85,247,0.1);border-color:rgba(168,85,247,0.5);}
.upload-icon{font-size:48px;margin-bottom:10px;}
.upload-text{font-weight:700;font-size:15px;margin-bottom:4px;}
.upload-sub{font-size:12px;color:rgba(255,255,255,0.7);font-weight:600;}
input[type=file]{display:none;}

.preview-area{margin-top:20px;display:none;}
.preview-area.show{display:block;}
.preview-img{
  max-width:100%;
  max-height:300px;
  border-radius:12px;
  border:2px solid var(--glass-border);
  display:block;
  margin:0 auto 16px;
  background:#fff;
  padding:6px;
}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
@media(max-width:600px){.controls{grid-template-columns:1fr;}}
label{display:block;font-size:11px;font-weight:800;color:rgba(255,255,255,0.85);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
input[type=number],input[type=range],select{
  width:100%;padding:11px 14px;
  background:var(--glass-bg-dark);
  border:2px solid var(--glass-border);
  border-radius:12px;font-size:13px;color:#fff;outline:none;
  font-family:inherit;font-weight:600;
}
input:focus,select:focus{border-color:rgba(168,85,247,0.6);}
select option{background:#1a1556;color:#fff;}

.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.preset{background:var(--glass-bg-dark);border:1.5px solid var(--glass-border);color:#fff;padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.preset:hover{background:rgba(168,85,247,0.2);}

.actions{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;padding:13px 18px;border-radius:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;border:2px solid;color:#fff;transition:all .25s;}
.btn-primary{background:var(--grad-pink);border-color:rgba(168,85,247,0.7);box-shadow:0 6px 18px rgba(168,85,247,0.4);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-secondary{background:var(--glass-bg-dark);border-color:var(--glass-border);}

.info-row{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.85);font-weight:600;margin:8px 0;padding:8px 12px;background:var(--glass-bg-dark);border-radius:10px;}
.info-row strong{color:#c4b5fd;}

.range-val{font-size:13px;font-weight:800;color:#c4b5fd;margin-left:8px;}

@media(max-width:768px){
  .hero h1{font-size:24px;}
  .hero-kn{font-size:15px;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hwrap">
    <a href="index.html" class="hbrand">
      <div class="hlogo"><img src="NammaJobs.png" alt="Namma Jobs" onerror="this.parentElement.innerHTML='🎯'"></div>
      <div>
        <div class="htxt-en">Namma <span>Jobs</span></div>
        <div class="htxt-kn">ನಮ್ಮ <span>ಜಾಬ್ಸ್</span></div>
      </div>
    </a>
    <a href="index.html" class="btn-back">← Back to Jobs</a>
  </div>
</header>

<div class="container">

  <div class="hero">
    <h1>🛠️ Image Tools</h1>
    <div class="hero-kn">ಚಿತ್ರ ಪರಿಕರಗಳು</div>
    <p>Resize, compress, and convert images for job applications</p>
  </div>

  <!-- TOOL TABS -->
  <div class="tools-grid">
    <div class="tool-tab on" onclick="switchTool('resize',this)">
      <div class="tool-icon">📐</div>
      <div>
        <div class="tool-name">Resize</div>
        <div class="tool-desc">Change dimensions</div>
      </div>
    </div>
    <div class="tool-tab" onclick="switchTool('compress',this)">
      <div class="tool-icon">🗜️</div>
      <div>
        <div class="tool-name">Compress</div>
        <div class="tool-desc">Reduce file size</div>
      </div>
    </div>
    <div class="tool-tab" onclick="switchTool('convert',this)">
      <div class="tool-icon">🔄</div>
      <div>
        <div class="tool-name">Convert</div>
        <div class="tool-desc">JPG / PNG / WEBP</div>
      </div>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📤</div>
      <div class="upload-text">Click to Upload Image</div>
      <div class="upload-sub">JPG, PNG, WEBP — Max 10MB</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">

    <div class="preview-area" id="preview">
      <img id="previewImg" class="preview-img" alt="Preview">

      <div class="info-row">
        <span>Original Size: <strong id="origSize">—</strong></span>
        <span>Dimensions: <strong id="origDim">—</strong></span>
      </div>

      <!-- RESIZE TOOL -->
      <div id="tool-resize" class="tool-content">
        <div class="preset-row">
          <button class="preset" onclick="setSize(100,150)">📷 100×150 (Photo)</button>
          <button class="preset" onclick="setSize(200,230)">🪪 200×230 (Passport)</button>
          <button class="preset" onclick="setSize(140,60)">✍️ 140×60 (Sign)</button>
          <button class="preset" onclick="setSize(600,800)">📄 600×800 (Form)</button>
        </div>
        <div class="controls">
          <div>
            <label>Width (px)</label>
            <input type="number" id="newWidth" placeholder="Width" min="1">
          </div>
          <div>
            <label>Height (px)</label>
            <input type="number" id="newHeight" placeholder="Height" min="1">
          </div>
        </div>
        <div class="info-row">
          <label style="margin:0;display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:normal;font-size:12px;">
            <input type="checkbox" id="keepRatio" checked style="width:16px;height:16px;cursor:pointer;accent-color:#a855f7;"> Maintain aspect ratio
          </label>
        </div>
      </div>

      <!-- COMPRESS TOOL -->
      <div id="tool-compress" class="tool-content" style="display:none;">
        <div class="controls" style="grid-template-columns:1fr;">
          <div>
            <label>Quality <span class="range-val" id="qualityVal">80%</span></label>
            <input type="range" id="quality" min="10" max="100" value="80" oninput="document.getElementById('qualityVal').textContent=this.value+'%';">
          </div>
        </div>
        <div class="preset-row">
          <button class="preset" onclick="setQuality(50)">High Compression (50%)</button>
          <button class="preset" onclick="setQuality(70)">Medium (70%)</button>
          <button class="preset" onclick="setQuality(90)">Low (90%)</button>
        </div>
      </div>

      <!-- CONVERT TOOL -->
      <div id="tool-convert" class="tool-content" style="display:none;">
        <div class="controls" style="grid-template-columns:1fr;">
          <div>
            <label>Output Format</label>
            <select id="outFormat">
              <option value="image/jpeg">JPG (Smaller, no transparency)</option>
              <option value="image/png">PNG (Best quality, supports transparency)</option>
              <option value="image/webp">WEBP (Modern, smaller size)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="processImage()">⚡ Process & Download</button>
        <button class="btn btn-secondary" onclick="reset()">🔄 New Image</button>
      </div>
    </div>
  </div>

</div>

<script>
let currentTool='resize',img=null,origFile=null;

function switchTool(tool,el){
  currentTool=tool;
  document.querySelectorAll('.tool-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.tool-content').forEach(c=>c.style.display='none');
  document.getElementById('tool-'+tool).style.display='block';
}

function handleFile(e){
  const f=e.target.files[0];
  if(!f)return;
  if(f.size>10*1024*1024){alert('Max 10MB!');return;}
  origFile=f;
  const reader=new FileReader();
  reader.onload=ev=>{
    img=new Image();
    img.onload=()=>{
      document.getElementById('previewImg').src=img.src;
      document.getElementById('origSize').textContent=fmtSize(f.size);
      document.getElementById('origDim').textContent=`${img.width}×${img.height}px`;
      document.getElementById('newWidth').value=img.width;
      document.getElementById('newHeight').value=img.height;
      document.getElementById('preview').classList.add('show');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(f);
}

function fmtSize(b){
  if(b<1024)return b+' B';
  if(b<1024*1024)return (b/1024).toFixed(1)+' KB';
  return (b/(1024*1024)).toFixed(2)+' MB';
}

function setSize(w,h){
  document.getElementById('newWidth').value=w;
  document.getElementById('newHeight').value=h;
}

function setQuality(q){
  document.getElementById('quality').value=q;
  document.getElementById('qualityVal').textContent=q+'%';
}

document.getElementById('newWidth').addEventListener('input',function(){
  if(!img||!document.getElementById('keepRatio').checked)return;
  const ratio=img.width/img.height;
  document.getElementById('newHeight').value=Math.round(this.value/ratio);
});
document.getElementById('newHeight').addEventListener('input',function(){
  if(!img||!document.getElementById('keepRatio').checked)return;
  const ratio=img.width/img.height;
  document.getElementById('newWidth').value=Math.round(this.value*ratio);
});

function processImage(){
  if(!img){alert('Upload image first!');return;}
  const canvas=document.createElement('canvas');
  let w=img.width,h=img.height;

  if(currentTool==='resize'){
    w=parseInt(document.getElementById('newWidth').value)||img.width;
    h=parseInt(document.getElementById('newHeight').value)||img.height;
  }

  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0,w,h);

  let format='image/jpeg', quality=0.92, ext='jpg';
  if(currentTool==='compress'){
    quality=parseInt(document.getElementById('quality').value)/100;
    format='image/jpeg';
    ext='jpg';
  } else if(currentTool==='convert'){
    format=document.getElementById('outFormat').value;
    ext=format.split('/')[1].replace('jpeg','jpg');
  } else {
    // resize keeps original format
    format=origFile.type.includes('png')?'image/png':'image/jpeg';
    ext=format.split('/')[1].replace('jpeg','jpg');
  }

  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='nammajobs-'+currentTool+'-'+Date.now()+'.'+ext;
    a.click();
    URL.revokeObjectURL(url);
  },format,quality);
}

function reset(){
  origFile=null;img=null;
  document.getElementById('preview').classList.remove('show');
  document.getElementById('fileInput').value='';
}
</script>
</body>
</html>
